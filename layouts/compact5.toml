# compact5: time, weather and a forecast column on top; CPU, GPU and RAM cards;
# AI limits and agents in the bottom card.
#   - no token counts anywhere: the limit bars (with pace ticks) and the agent dots,
#     timers and name colors carry what matters
#   - no wattage, memory numbers or per-core bars; the CPU card ends in a RAM bar, as
#     the GPU card ends in a VRAM bar
#   - every row shares the edges at x=315 and 630
#   - AI limits stacked per provider: big 5h % and full-width bars sharing one scale

[display]
port = "auto"
brightness = 60         # daytime
night_brightness = 20   # after dusk; fades through civil twilight (sun 6° above to 6° below the horizon)
dim_brightness = 10
follow_session = true
flip = false
theme = "current"
muted_lift = 0.3        # secondary text (labels, units, sizes) closer to the main text

[[widget]]
type = "clock_weather"
box = [0, 0, 315, 110]
arrangement = "row"
show = "time"
date_side = "right"
date_size = 22
time_size = 100

[[widget]]
type = "clock_weather"
box = [315, 0, 315, 110]
arrangement = "row"
show = "weather"
forecast = false
units = "imperial"
temp_size = 84
hilo_size = 20
icon_left = true
stale = "icon"

[[widget]]
type = "forecast"
box = [630, 0, 170, 270]
units = "imperial"
hours = 8
columns = 1
fill = true             # fonts and icons sized to the rows

[[widget]]
type = "cpu"
box = [0, 110, 315, 160]
ram = "bar"             # RAM bar in the CPU card, where the core bars were
cores = false           # no per-core bars
power = false
label = ""
temp_unit = "°"
size = 30
watt_digits = 3
temp_warn = 75
temp_crit = 85
power_warn = 60
power_crit = 80

[[widget]]
type = "gpu"
box = [315, 110, 315, 160]
power = false
mem_numbers = false
label = "\U000F08AE"
temp_unit = "°"
size = 30
temp_warn = 75
temp_crit = 83
power_warn = 180
power_crit = 210

[[widget]]
type = "ai_usage"
box = [0, 270, 315, 210]
providers = ["claude", "codex"]
window_labels = false
arrangement = "stacked"
stale = "icon"

[[widget]]
type = "agents"
box = [315, 270, 485, 210]
stats = "none"
status = "dot"
rows = "single"
row_height = 36
max_rows = 4
time_colors = true      # working dot by job run time, idle timer by idle time: green -> yellow 10 min -> red 20 min
context_colors = true   # name: -> yellow -> red as the context window fills
tokens = false          # no per-session token counts
detail_rows = 3         # up to 3 sessions: two lines each (model, context-fill bar); 4+: compact rows

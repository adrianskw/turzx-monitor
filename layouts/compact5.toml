# compact5: time, weather and a forecast column on top; CPU and GPU cards;
# AI limits and agents in the bottom card.
#   - no token counts anywhere: the limit bars (with pace ticks) and the agent dots,
#     timers and name colors carry what matters
#   - no wattage, memory numbers or per-core bars; a RAM bar (teal) after the CPU icon,
#     a VRAM bar (purple) after the GPU's, in line with the readings; the graphs
#     sit under the numbers in a short row, leaving the height to AI limits and agents
#   - every row shares the edges at x=315 and 630
#   - AI limits stacked per provider: big 5h % and full-width bars sharing one scale

[display]
port = "auto"
brightness = 60         # daytime
night_brightness = 20   # after dusk; fades through civil twilight (sun 6° above to 6° below the horizon)
dim_brightness = 10
follow_session = true
flip = false
theme = "current"
muted_lift = 0.3        # secondary text (labels, units, sizes) closer to the main text
font = "UbuntuMono Nerd Font"  # scaled to JetBrains Mono's character width, so sizes stay tuned

[[widget]]
type = "clock_weather"
box = [0, 0, 315, 110]
arrangement = "row"
show = "time"
date_side = "right"
date_size = 22
time_size = 100
ampm_style = "below"    # small AM/PM under the time, right-aligned
sun = true              # next sunrise and sunset on the AM/PM line, left-aligned

[[widget]]
type = "clock_weather"
box = [315, 0, 315, 110]
arrangement = "row"
show = "weather"
forecast = false
units = "imperial"
temp_size = 84
hilo_size = 18
hilo_style = "below"    # high, low and humidity on one line under the temperature
icon_left = true
align = "time"          # temperature digits the time's size, on the same bottom line
stale = "icon"

[[widget]]
type = "forecast"
box = [630, 0, 170, 220]
units = "imperial"
hours = 7
columns = 1
fill = true             # fonts and icons sized to the rows

[[widget]]
type = "cpu"
box = [0, 110, 315, 110]
ram = "inline"          # RAM bar in the headline, after the icon
cores = false           # no per-core bars
power = false
label = ""
temp_unit = "°"
size = 30
watt_digits = 3
temp_warn = 75
temp_crit = 85
power_warn = 60
power_crit = 80

[[widget]]
type = "gpu"
box = [315, 110, 315, 110]
power = false
vram = "inline"         # VRAM bar in the headline, after the icon
label = "\U000F08AE"
temp_unit = "°"
size = 30
temp_warn = 75
temp_crit = 83
power_warn = 180
power_crit = 210

[[widget]]
type = "ai_usage"
box = [0, 220, 315, 260]
providers = ["claude", "codex", "agy"]  # agy: Antigravity's Gemini quota (Flash + Pro share it)
window_labels = false
arrangement = "stacked"
pace_7d = "workweek"    # 7d tick follows a routine: work 9-18 weekdays, lighter mornings,
                        # evenings (0.25) and weekends (0.15), none while asleep (1-7)
stale = "icon"

[[widget]]
type = "agents"
box = [315, 220, 485, 260]
stats = "none"
status = "dot"
rows = "single"
row_height = 32
max_rows = 6            # 6 sessions, then a "+N more" row
summary = true          # on the "+N more" row: sessions per tool and how many are working
time_colors = true      # working dot by job run time, idle timer by idle time: green -> yellow 10 min -> red 20 min
context_colors = true   # name: -> yellow -> red as the context window fills
tokens = false          # no per-session token counts
detail_rows = 4         # up to 4 sessions: two lines each (model, context-fill bar); 5+: compact rows
spread = true           # compact rows share out the card height
context_bar = true      # compact rows: context tokens + a slim fill bar between name and timer
waiting = true          # bell + magenta timer when a session is stopped on a prompt or question
